<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030203">
<title>Спидпеинт</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css?v=studio">
<script type="module" src="./app.mjs?v=studio"></script>
</head>
<body>
<main>
<header>
<h1>Speedpaint</h1>
<div id="source" hidden><span id="filename"></span><span id="dimensions"></span></div>
<button id="replace" hidden>Заменить фото</button>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
</header>
<div class="studio">
<section class="workspace" aria-label="Холст">
<div id="surface">
<div id="drop">
<button id="choose" class="primary">Выбрать фото</button>
<small>Или перетащите JPG, PNG или WEBP</small>
</div>
<canvas id="canvas" hidden aria-label="Текущий рисунок"></canvas>
</div>
<div id="playback" hidden>
<div class="timeline">
<progress id="progress" value="0" max="1" aria-label="Прогресс рисования"></progress>
<ol aria-label="Этапы рисования"><li>Набросок</li><li>Подмалёвок</li><li>Детализация</li></ol>
</div>
<div class="controls">
<button id="start" class="primary" disabled>Старт</button>
<button id="reset" disabled>Сбросить</button>
<label class="speed" for="speed">Скорость <input id="speed" type="range" min=".25" max="4" step=".25" value="1"><output for="speed">1×</output></label>
<span id="clock">0:00 / 0:30</span>
</div>
<div id="downloads" hidden>
<button id="export" class="primary" disabled>Скачать видео</button>
<button id="save-png" disabled>Сохранить PNG</button>
</div>
</div>
<p id="status" role="status">Фото обрабатывается на устройстве.</p>
</section>
<aside aria-label="Настройки кисти">
<h2>Настройки</h2>
<label class="setting" for="brush">Размер кисти <output for="brush">100%</output></label>
<input id="brush" type="range" min="60" max="160" step="5" value="100">
<label class="setting" for="detail">Детализация <output for="detail">65%</output></label>
<input id="detail" type="range" min="0" max="100" step="5" value="65">
</aside>
</div>
</main>
</body>
</html>
