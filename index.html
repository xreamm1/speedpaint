<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Спидпеинт</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css?v=form-strokes">
<script type="module" src="./app.mjs?v=form-strokes"></script>
</head>
<body>
<header>
<div class="header-inner">
<div class="wordmark" aria-label="Speedpaint">
<svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7H8a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V13M12 21l2-6L25 4l4 4-11 11-6 2Zm11-15 4 4"/></svg>
<span>Speedpaint</span>
</div>
<div id="source" hidden><span id="filename"></span><span id="dimensions"></span></div>
<label id="replace" class="file-picker" hidden><span>Заменить фото</span><input type="file" accept="image/jpeg,image/png,image/webp" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0"></label>
</div>
</header>
<main>
<section id="upload" class="upload-section" aria-labelledby="upload-title">
<h1 id="upload-title">Рисование по фото</h1>
<div id="drop">
<div class="upload-card">
<h2>Выберите фотографию</h2>
<p class="intro">Перетащите сюда JPG, PNG или WebP.</p>
<label id="choose-upload" class="file-picker primary"><span>Выбрать файл</span><input type="file" accept="image/jpeg,image/png,image/webp" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0"></label>
<p id="upload-status" role="status">Фото обрабатывается на устройстве.</p>
</div>
</div>
</section>
<div id="demo" class="demo" aria-label="Примеры рисования">
<div class="gallery-heading"><h2>Примеры</h2><button id="demo-fold" type="button" aria-controls="demo-gallery" aria-expanded="true">Свернуть видео</button></div>
<div class="demo-track"><div class="demo-media">
<div id="demo-gallery" class="demo-gallery">
<figure><video muted playsinline loop preload="none" poster="./demo-ink.webp?v=form-strokes" src="./demo-ink.webm?v=form-strokes" aria-label="Пример рисования иллюстрации"></video><button class="demo-play" type="button" aria-label="Воспроизвести: иллюстрация">▶</button><figcaption>Иллюстрация</figcaption></figure>
<figure><video muted playsinline loop preload="none" poster="./demo-apple.webp?v=form-strokes" src="./demo-apple.webm?v=form-strokes" aria-label="Пример рисования яблока"></video><button class="demo-play" type="button" aria-label="Воспроизвести: яблоко">▶</button><figcaption>Яблоко</figcaption></figure>
<figure><video muted playsinline loop preload="none" poster="./demo-fruits.webp?v=form-strokes" src="./demo-fruits.webm?v=form-strokes" aria-label="Пример рисования натюрморта"></video><button class="demo-play" type="button" aria-label="Воспроизвести: натюрморт">▶</button><figcaption>Натюрморт</figcaption></figure>
</div>
<div class="demo-shade" aria-hidden="true"></div>
</div></div>

</div>

<div id="editor" class="studio" hidden>
<section class="workspace" aria-label="Холст">
<div class="drawing-modes" aria-label="Режим рисования">
<button id="mode-speedpaint" type="button" aria-pressed="true">Спидпеинт</button>
<button id="mode-numbers" type="button" aria-pressed="false">Раскраска по номерам</button>
</div>
<div id="number-workspace" hidden>
<p>Выбери цвет с нужным номером и проведи кистью по области.</p>
<div id="number-palette" aria-label="Палитра"></div>
<div class="number-tools">
<label>Кисть <input id="number-brush" type="range" min="1" max="8" value="3"></label>
<button id="number-full-brush" type="button" aria-pressed="false">Кисть на весь холст</button>
<button id="number-photo" type="button" aria-pressed="false">Показать оригинал</button>
<button id="number-undo" type="button" disabled>Отменить мазок</button>
</div>
<canvas id="number-canvas" draggable="false" aria-label="Раскраска по номерам"></canvas>
</div>
<div id="surface">
<canvas id="canvas" hidden aria-label="Текущий рисунок"></canvas>
<div id="processing" hidden aria-labelledby="processing-title">

<h2 id="processing-title">Подготовка рисунка</h2>
<p id="processing-step" role="status">Анализирую изображение…</p>
<progress id="processing-progress" max="100" value="0" aria-label="Прогресс подготовки"></progress>
</div>
</div>
<div id="playback" hidden>
<div class="timeline">
<progress id="progress" value="0" max="1" aria-label="Прогресс рисования"></progress>
<ol aria-label="Этапы рисования"><li><span>Лайнарт</span></li><li><span>Плоский цвет</span></li><li><span>Детализация</span></li></ol>
<p id="current-stage" aria-hidden="true"></p>
</div>
<div class="controls">
<button id="start" class="primary" disabled>Старт</button>
<p id="status" role="status"></p>
<button id="reset" disabled>Сбросить</button>
<label class="speed" for="speed">Скорость <input id="speed" type="range" min=".25" max="4" step=".25" value="1"><output for="speed">1×</output></label>
<span id="clock">0:00 / 1:04</span>
</div>
<div id="downloads" hidden>
<label for="video-duration">Длительность видео, с <input id="video-duration" type="number" min="5" max="180" step="1" value="30" required></label>
<button id="export" class="primary" disabled>Скачать видео</button>
<button id="save-png" disabled>Рисунок в PNG</button>
</div>
</div>

</section>

</div>

</main>
</body>
</html>
