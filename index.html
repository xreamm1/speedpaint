<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>Спидпеинт</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css?v=fold">
<script type="module" src="./app.mjs?v=fold"></script>
</head>
<body>
<main>
<header>
<div class="wordmark" aria-label="Speedpaint">
<svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7H8a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V13M12 21l2-6L25 4l4 4-11 11-6 2Zm11-15 4 4"/></svg>
<span>Speedpaint</span>
</div>
<div id="source" hidden><span id="filename"></span><span id="dimensions"></span></div>
<a id="upload-link" href="#upload">К загрузке <span aria-hidden="true">↓</span></a>
<button id="replace" hidden>Заменить фото</button>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
</header>
<div id="demo" class="demo" aria-label="Пример рисования">
<video id="demo-video" muted playsinline loop preload="metadata" poster="./demo.webp" aria-label="Пример спидпеинта яблока">
<source src="./demo.webm" type="video/webm">
</video>
<button id="demo-toggle" type="button" aria-label="Воспроизвести пример">▶</button>
<button id="demo-fold" type="button" aria-controls="demo-video" aria-expanded="true">Свернуть видео</button>
</div>
<div class="studio">
<section class="workspace" aria-label="Холст">
<div id="surface">
<div id="drop">
<h1 id="upload">Рисование по фото</h1>
<div class="upload-card">
<h2>Загрузите изображение</h2>
<p class="intro">Перетащите JPG, PNG или WEBP сюда или выберите файл. Speedpaint превратит фото в рисунок и запишет процесс.</p>
<button id="choose" class="primary">Выбрать фото</button>
<p id="status" role="status">Фото обрабатывается на устройстве.</p>
</div>
</div>
<canvas id="canvas" hidden aria-label="Текущий рисунок"></canvas>
</div>
<div id="playback" hidden>
<div class="timeline">
<progress id="progress" value="0" max="1" aria-label="Прогресс рисования"></progress>
<ol aria-label="Этапы рисования"><li>Набросок</li><li>Подмалёвок</li><li>Детализация</li></ol>
</div>
<div class="controls">
<button id="start" class="primary" disabled>Старт</button>
<button id="reset" disabled>Сбросить</button>
<label class="speed" for="speed">Скорость <input id="speed" type="range" min=".25" max="4" step=".25" value="1"><output for="speed">1×</output></label>
<span id="clock">0:00 / 0:30</span>
</div>
<div id="downloads" hidden>
<button id="export" class="primary" disabled>Скачать видео</button>
<button id="save-png" disabled>Сохранить PNG</button>
</div>
</div>
</section>
<aside aria-label="Настройки кисти">
<h2>Настройки</h2>
<label class="setting" for="brush">Размер кисти <output for="brush">100%</output></label>
<input id="brush" type="range" min="60" max="160" step="5" value="100">
<label class="setting" for="detail">Детализация <output for="detail">65%</output></label>
<input id="detail" type="range" min="0" max="100" step="5" value="65">
</aside>
</div>
</main>
</body>
</html>
